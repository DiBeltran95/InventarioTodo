name: Build

# Genera el **IPA de iOS**. Es el único entregable de este workflow.
#
# ── Por qué todo ocurre en UN SOLO trabajo ──────────────────────────────────
#
# Verificar y compilar están en el mismo trabajo, no en dos encadenados. El
# orden que importa se mantiene —análisis y pruebas primero, compilación
# después— pero con una diferencia decisiva: **una sola petición de runner**.
#
# Cada trabajo pide su propia máquina, y cuando GitHub no las está asignando
# —caída del 6 de agosto de 2026: «jobs may remain queued for an extended
# period before starting or may time out»— cada petición extra es otra
# oportunidad de quedarse sin nada. Con `verificar` en Ubuntu y `ios` en macOS
# hacían falta dos aciertos seguidos; si el primero fallaba, el IPA ni se
# intentaba. Ahora hace falta uno.
#
# De paso, reutiliza el checkout y el SDK: analizar y probar aquí no cuesta
# tiempo extra de preparación.
#
# ── Si el trabajo sale «cancelled» SIN NINGÚN paso ejecutado ────────────────
#
# No es del código ni de este archivo: nunca consiguió runner. Se reconoce
# porque no aparece «Set up job» y la ejecución muere a los ~15 minutos.
#
#   1. Mira https://www.githubstatus.com. Con Actions caído no hay nada que
#      arreglar aquí: se relanza cuando se restablezca.
#   2. Si Actions está bien, mira Settings → Billing. macOS consume 10 minutos
#      de cuota por cada minuto real; en repositorios públicos es gratis.
#
# Alternativa que no depende de GitHub: `codemagic.yaml`, en la raíz.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:
    inputs:
      construir_android:
        description: 'Compilar también el APK de Android (no se genera por defecto)'
        type: boolean
        default: false
      omitir_verificacion:
        description: 'Compilar aunque falle el análisis (para sacar un binario con el CI averiado)'
        type: boolean
        default: false

# Al empujar dos veces seguidas, la primera ejecución deja de ser interesante.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # iOS — verifica y compila el .ipa SIN FIRMAR.
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: IPA iOS (sin firmar)
    runs-on: macos-latest
    # Cubre también el tiempo EN COLA: más vale fallar pronto y relanzar que
    # descubrir media hora después que nunca llegó a arrancar.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      # ── Verificación ───────────────────────────────────────────────────────
      # `continue-on-error` sólo se activa si alguien marca la casilla en el
      # disparador manual. Por defecto el análisis sigue siendo bloqueante: un
      # IPA que no pasa sus propias pruebas no vale la pena empaquetarlo.

      - name: flutter analyze
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter analyze

      - name: Pruebas
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter test

      # ── Compilación ────────────────────────────────────────────────────────

      - name: Compilar sin firmar
        working-directory: mobile
        # `--no-codesign` es obligatorio aquí: firmar exige un certificado de
        # desarrollador de Apple (cuenta de pago) que no está en los secretos.
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Empaquetar el .ipa
        working-directory: mobile
        # Un .ipa no es más que un zip con la app dentro de una carpeta
        # `Payload/`. `flutter build ipa` no sirve sin firma, así que se
        # empaqueta a mano.
        #
        # El resultado NO se instala directo en un iPhone: hay que firmarlo
        # antes con Sideloadly, AltStore o Xcode. Con una cuenta gratuita de
        # Apple caduca a los 7 días y compite con el tope de 3 apps.
        #
        # El número de compilación va en el nombre del archivo: tras varias
        # descargas, tres `.ipa` idénticos en la carpeta no dejan saber cuál
        # lleva los últimos cambios.
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr Ventario-${{ github.run_number }}.ipa Payload
          rm -rf Payload
          ls -lh Ventario-${{ github.run_number }}.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: mobile/Ventario-${{ github.run_number }}.ipa
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Android — APAGADO. Sólo se compila marcando la casilla en «Run workflow».
  #
  # Se conserva porque el APK es la forma práctica de probar la app en un
  # teléfono —se instala directo y no caduca, al revés que el IPA sin firmar—,
  # pero no se genera en ninguna ejecución automática.
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: APK Android (a petición)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.construir_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter analyze

      - name: Pruebas
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter test

      - name: Compilar APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
